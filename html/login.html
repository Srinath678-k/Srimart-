<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SriMart</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">

    <meta name="description" content="SriMart - Your one-stop shop for everything. Fast delivery and best prices.">
    <meta property="og:title" content="SriMart E-commerce">
    <meta property="og:description" content="Shop the latest trends at SriMart.">
    <meta property="og:type" content="website">
    <link rel="manifest" href="../manifest.json">

</head>
<body>

    <!-- Sticky Navbar (Simplified for Auth Pages) -->
    <header class="header">
        <div class="container header-container" style="justify-content: center;">
            <a href="../index.html" class="logo">
                <i class="fas fa-shopping-bag logo-icon"></i>
                <span class="logo-text"><b>Sri</b>Mart</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-banner">
                <h2>Login to SriMart</h2>
                <p>Get access to your Orders, Wishlist and Recommendations.</p>
            </div>
            <div class="auth-form-wrapper">
                <h3>Welcome Back</h3>
                <form id="login-form">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your 10-digit mobile number" autocomplete="tel">
                    </div>

                    <!-- OTP Section -->
                    <div id="otp-section">
                        <button type="button" id="send-otp-btn" class="auth-submit-btn">Request OTP</button>
                        
                        <div id="otp-input-group" style="display: none; margin-top: 15px;">
                            <div class="form-group">
                                <label for="otp">Enter OTP</label>
                                <input type="text" id="otp" name="otp" placeholder="Enter 4-digit OTP (e.g. 1234)" maxlength="4">
                                <p style="font-size:0.8rem; color:var(--success-color); margin-top:5px;"><i class="fas fa-check-circle"></i> OTP sent successfully! (Use any 4 digits to test)</p>
                            </div>
                            <button type="button" id="verify-otp-btn" class="auth-submit-btn">Verify & Login</button>
                        </div>
                    </div>

                    <div class="auth-link" style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 15px; text-align: center;">
                        Don't have an account? <a href="register.html">Sign Up</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Fixed Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav mobile-only" id="mobile-bottom-navbar" aria-label="Mobile Bottom Navigation">
        <a href="../index.html" class="mobile-bottom-item" id="btn-bottom-home">
            <div class="bottom-icon-wrap">
                <i class="fas fa-home"></i>
            </div>
            <span>Home</span>
        </a>
        <a href="categories.html" class="mobile-bottom-item" id="btn-bottom-categories">
            <div class="bottom-icon-wrap">
                <i class="fas fa-th-large"></i>
            </div>
            <span>Categories</span>
        </a>
        <a href="login.html" class="mobile-bottom-item active" id="btn-bottom-profile">
            <div class="bottom-icon-wrap">
                <i class="fas fa-user"></i>
            </div>
            <span>Account</span>
        </a>
        <a href="cart.html" class="mobile-bottom-item" id="btn-bottom-cart">
            <div class="bottom-icon-wrap">
                <i class="fas fa-shopping-cart"></i>
                <span class="bottom-badge" id="bottom-cart-badge" style="display: none;">0</span>
            </div>
            <span>Cart</span>
        </a>
    </nav>

    <!-- JS Files -->
    <script src="../js/data.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/i18n.js"></script>
    <script src="../js/core/recommendations.js"></script>
    <script src="../js/core/calculations.js"></script>
    <script src="../js/core/filters.js"></script>
    <script src="../js/components/productCard.js"></script>
    <script src="../js/features/chat.js"></script>
    <script src="../js/features/theme.js"></script>
    <script src="../js/features/navbar.js"></script>
    <script src="../js/features/formValidation.js"></script>
    <script src="../js/features/auth.js"></script>
</body>
</html>
