<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products - SriMart</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <style>
        .compare-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .compare-header {
            margin-bottom: 35px;
            text-align: center;
        }
        .compare-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .compare-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        #compare-workspace {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .compare-grid {
            display: grid;
            grid-template-columns: 200px repeat(var(--compare-cols, 3), 1fr);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        @media (max-width: 768px) {
            .compare-grid {
                grid-template-columns: 100px repeat(var(--compare-cols, 3), 1fr);
                min-width: 750px;
            }
            .compare-row-header, .compare-cell {
                padding: 10px;
                font-size: 0.8rem;
            }
            .compare-cell img {
                width: 70px;
                height: 70px;
            }
        }
        .compare-row-header {
            background-color: var(--bg-hover);
            font-weight: 600;
            padding: 18px;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .compare-cell {
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .compare-cell:last-child {
            border-right: none;
        }
        .compare-cell.product-card-cell {
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: var(--bg-card);
        }
        .compare-cell img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
            background: #fff;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .remove-compare-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--error-color, #dc3545);
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .remove-compare-btn:hover {
            opacity: 1;
        }
        .compare-section-title {
            grid-column: 1 / -1;
            background-color: var(--bg-hover);
            color: var(--text-primary);
            font-weight: 700;
            padding: 10px 18px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }
        .empty-compare-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            max-width: 500px;
            margin: 40px auto;
            box-shadow: var(--shadow-sm);
        }
        .empty-compare-state i {
            font-size: 4rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .highlight-better {
            background-color: rgba(11, 110, 79, 0.04);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header loaded dynamically -->
    <header class="header" id="header">
        <div class="container header-container">
            <div class="logo-container">
                <button class="hamburger-menu" id="hamburger-menu" aria-label="Menu"><i class="fas fa-bars"></i></button>
                <a href="../index.html" class="logo">
                    <i class="fas fa-shopping-bag logo-icon"></i>
                    <span class="logo-text"><b>Sri</b>Mart</span>
                </a>
            </div>
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input type="text" id="search-input" placeholder="Search for products, brands and more" autocomplete="off">
                    <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
                </form>
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>
            <nav class="nav-links" id="nav-links">
                <button class="close-menu" id="close-menu"><i class="fas fa-times"></i></button>
                <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
                <a href="wishlist.html" class="nav-item"><i class="fas fa-heart"></i><span>Wishlist</span></a>
                <a href="cart.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i><span>Cart</span>
                    <span class="cart-badge" id="cart-badge">0</span>
                </a>
                <div class="theme-switch" id="theme-toggle" aria-label="Toggle Theme"><i class="fas fa-moon theme-switch-icon"></i><i class="fas fa-sun theme-switch-icon"></i></div>
            </nav>
        </div>
    </header>

    <main class="container" style="min-height: 70vh;">
        <div class="compare-container">
            <div class="compare-header">
                <h1>Compare Products</h1>
                <p>Add up to 3 products to compare specs, ratings, and pricing side-by-side.</p>
            </div>
            
            <div id="compare-workspace">
                <!-- Injected dynamically via compare.js -->
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <!-- Fixed Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav mobile-only" id="mobile-bottom-navbar" aria-label="Mobile Bottom Navigation">
        <a href="../index.html" class="mobile-bottom-item" id="btn-bottom-home">
            <div class="bottom-icon-wrap">
                <i class="fas fa-home"></i>
            </div>
            <span>Home</span>
        </a>
        <a href="categories.html" class="mobile-bottom-item" id="btn-bottom-categories">
            <div class="bottom-icon-wrap">
                <i class="fas fa-th-large"></i>
            </div>
            <span>Categories</span>
        </a>
        <a href="profile.html" class="mobile-bottom-item" id="btn-bottom-profile">
            <div class="bottom-icon-wrap">
                <i class="fas fa-user"></i>
            </div>
            <span>Account</span>
        </a>
        <a href="cart.html" class="mobile-bottom-item" id="btn-bottom-cart">
            <div class="bottom-icon-wrap">
                <i class="fas fa-shopping-cart"></i>
                <span class="bottom-badge" id="bottom-cart-badge" style="display: none;">0</span>
            </div>
            <span>Cart</span>
        </a>
    </nav>

    <!-- JS Files -->
    <script src="../js/data.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/state.js"></script>
    <script src="../js/core/i18n.js"></script>
    <script src="../js/core/recommendations.js"></script>
    <script src="../js/core/calculations.js"></script>
    <script src="../js/core/filters.js"></script>
    <script src="../js/components/productCard.js"></script>
    <script src="../js/features/chat.js"></script>
    <script src="../js/features/theme.js"></script>
    <script src="../js/features/navbar.js"></script>
    <script src="../js/features/compare.js"></script>
</body>
</html>
